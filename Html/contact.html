<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css" type="text/css">
    <script src="../contact.js" defer></script>
    <title>Kontakt</title>
    
</head>
<body>
    <header class="header-web">
        <img src="../images/LOGGAVIT.png" alt="vit logga">
        <h1><span class="lek">Lek</span><span class="zonen">Zonen</span></h1>
        <button class="menu-button">≡ Meny</button>
        <nav class="menu">
            <ul>
                <li><a href="start.html">HEM</a></li>
                <li><a href="meets.html">TRÄFFAR</a></li>
                <li><a href="contact.html">KONTAKT</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
            <h2>Kontakta oss</h2>
            <p>Har du frågor om LekZonen? Skriv till oss så svarar vi.</p>

            <div class="contact-part">
                <form class="contact-form">
                    <div class="input-section">
                        <label for="c-name">Namn</label>
                        <input type="text" id="c-name">
                    </div>
                    <div class="input-section">
                        <label for="c-email">E-post</label>
                        <input type="text" id="c-email">
                    </div>
                    <div class="input-section">
                        <label for="c-message">Meddelande</label>
                        <textarea type="text" id="c-message"></textarea>
                    </div>
                    <div class="contactmessage">
                        <!--Fel och tack meddelande-->
                    </div>
                    <button class="button-sub" type="submit">Skicka</button>
                </form>

                <div class="contact-me">
                    <h2>Direkt kontakt</h2>
                    <p>Victor</p>
                    <p>lek@zonen.woof</p>
                    <p>031 012 345</p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <div class="footer-text">
            <h3><span class="lek">Lek</span><span class="zonen">Zonen</span></h3>
            <p>Där hundar möts</p>
        </div>
        <div class="footer-contact">
            <p><a href="mailto:lek@zonen.woof">lek@zonen.woof</a> - 031 012 345</p>
        </div>
    </footer>
    
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css" type="text/css">
    <script src="../meets.js" defer></script>
    <title>Träffar</title>
    
</head>
<body>
    <header class="header-web">
        <img src="../images/LOGGAVIT.png" alt="vit logga">
        <h1><span class="lek">Lek</span><span class="zonen">Zonen</span></h1>
        <button class="menu-button">≡ Meny</button>
        <nav class="menu">
            <ul>
                <li><a href="start.html">HEM</a></li>
                <li><a href="meets.html">TRÄFFAR</a></li>
                <li><a href="contact.html">KONTAKT</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="intro-text"><h2>Träffar</h2>
        <p class="intro-träffar">Hitta en hundträff i din stad, eller skapa en egen.</p>
        </div>
        
        <div class="filter-city"> <!--Filter för stad-->
            <p>Plats</p>
            <button class="filter-button" id="cAlla">Alla</button>
            <button class="filter-button" id="cGBG">Göteborg</button>
            <button class="filter-button" id="cSthlm">Stockholm</button>
            <button class="filter-button" id="cMal">Malmö</button>
        </div>
        <div class="filter-size"> <!--Filter för Storlek-->
            <p>Storlek</p>
            <button class="filter-button" id="sAlla">Alla</button>
            <button class="filter-button" id="sSma">Små</button>
            <button class="filter-button" id="sMel">Mellan</button>
            <button class="filter-button" id="sStor">Stora</button>
        </div>

        <div class="create-meet"> <!--Skapa träff section-->
            <button class="button-create">Skapa träff</button> <!--Knapp som öppnar upp formuläret-->

            <form id="create-form">
                <div class="cdtp-input"> <!--cdtp = City, Date&Time, Place-->
                    <div class="city">
                        <label for="select-city">Stad</label>
                        <select id="select-city">
                            <option value="Göteborg">Göteborg</option>
                            <option value="Stockholm">Stockholm</option>
                            <option value="Malmö">Malmö</option>
                        </select>
                    </div>
                    <div class="time-date">
                        <label for="select-timedate">Datum & Tid</label>
                        <input type="datetime-local" id="select-timedate">
                    </div>
                    <div class="place">
                        <label for="select-place">Plats</label>
                        <input type="text" id="select-place">
                    </div>
                </div>

                <div class="create-size">
                    <p>Välkommna storlekar</p>
                    <div class="checkboxes">
                        <label class="check"><input type="checkbox" name="storlek" id="small">Små</label>
                        <label class="check"><input type="checkbox" name="storlek" id="medium">Mellan</label>
                        <label class="check"><input type="checkbox" name="storlek" id="large">Stora</label>
                    </div>
                </div>
                <div class="missedfield"></div>

                <button class="button-publish">Publicera träff</button> <!--Knapp som skickar formuläret som läggs i <div class="meetups"> -->

            </form>
        </div>

        <div class="meetups">
            <!--Här läggs puffar för skapade träffar-->
        </div>


    </main>

    <footer>
        <div class="footer-text">
            <h3><span class="lek">Lek</span><span class="zonen">Zonen</span></h3>
            <p>Där hundar möts</p>
        </div>
        <div class="footer-contact">
            <p><a href="mailto:lek@zonen.woof">lek@zonen.woof</a> - 031 012 345</p>
        </div>
    </footer>
    
</body>
</html>
